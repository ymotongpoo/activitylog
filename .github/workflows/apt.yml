name: apt

# Publishes the apt repository on GitHub Pages from the .deb assets of the
# most recent activitylog and Collector Extra releases. Called by the release
# workflow, on a daily schedule, or by hand. Uses the existing APT_SIGNING_KEY.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  REPO_URL: https://ymotongpoo.github.io/activitylog/apt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install apt-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils
      - name: Download packages from recent releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pool=site/apt/pool/main/a/activitylog-agent
          mkdir -p "$pool"
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 5 --exclude-drafts --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir "$pool" || true
          done
          ls -l "$pool"
          test -n "$(ls "$pool")"
      - name: Test signed package indexes
        run: sh agent/packaging/linux/test-build-apt-repo.sh
      - name: Test Collector release import
        run: python3 agent/packaging/linux/test-download-collector-packages.py
      - name: Download verified Collector packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh agent/packaging/linux/download-collector-packages.sh site/apt/pool/main/o/otelcol-extra
          if find site/apt/pool -name 'discord-otelcol_*.deb' -print -quit | grep -q .; then
            echo 'Retired Collector package found in the publication pool' >&2
            exit 1
          fi
      - name: Build and sign the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -eu
          sh agent/packaging/linux/build-apt-repo.sh site/apt
          cp agent/packaging/linux/index.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Installs the package from the published repository in a clean container.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install from the apt repository
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl >/dev/null
          for i in 1 2 3 4 5 6; do
            curl -fsSL "$REPO_URL/activitylog.gpg" -o /usr/share/keyrings/activitylog.gpg && break
            sleep 20
          done
          echo "deb [signed-by=/usr/share/keyrings/activitylog.gpg] $REPO_URL stable main" \
            > /etc/apt/sources.list.d/activitylog.list
          for i in 1 2 3 4 5 6; do
            if apt-get update -qq && apt-cache show activitylog-agent >/dev/null 2>&1 && \
                apt-cache show otelcol-extra >/dev/null 2>&1; then
              break
            fi
            sleep 20
          done
          apt-get install -y activitylog-agent otelcol-extra
          activitylog-agent version
          otelcol-extra --version
          printf '%s' 'apt-verification-fixture' | otelcol-extra-set-credentials discord --stdin --with-key=host
          mkdir -m 0700 /run/collector-apt-credentials
          systemd-creds decrypt --name=discord_bot_token /etc/credstore.encrypted/otelcol-extra.discord /run/collector-apt-credentials/discord_bot_token
          CREDENTIALS_DIRECTORY=/run/collector-apt-credentials otelcol-extra validate --config=/etc/otelcol-extra/config.yaml \
            --config=/usr/share/otelcol-extra/examples/discord.yaml
          test "$(stat -c '%a:%U:%G' /etc/credstore.encrypted/otelcol-extra.discord)" = 600:root:root
          otelcol-extra components > components.txt
          for component in discord slack switchbot s3tables otlp_http; do grep -q "name: $component" components.txt; done
          test -f /usr/lib/systemd/system/otelcol-extra.service
          test ! -e /etc/systemd/system/multi-user.target.wants/otelcol-extra.service
          # A name referenced by Breaks/Replaces may return success from "show"
          # without having any package versions. Check published versions instead.
          test -z "$(apt-cache madison discord-otelcol)"
          test ! -e /usr/bin/discord-otelcol
          test ! -e /usr/lib/systemd/system/discord-otelcol.service
          test -f /usr/lib/systemd/user/activitylog-agent.service
          test -f /usr/share/gnome-shell/extensions/activitylog@ymotongpoo.net/metadata.json
          # Without a window system the agent falls back to terminal mode.
          activitylog-agent doctor | tee doctor.txt || true
          grep -q "mode: terminal" doctor.txt
