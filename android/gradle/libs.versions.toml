[versions]
agp = "8.13.2"
kotlin = "2.2.21"
androidxCore = "1.17.0"
androidxWork = "2.11.0"
junit = "4.13.2"
orgJson = "20250517"
garminConnectIq = "2.4.0"
healthConnect = "1.1.0"
androidxActivity = "1.11.0"
coroutines = "1.10.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidxWork" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
garmin-connectiq = { module = "com.garmin.connectiq:ciq-companion-app-sdk", version.ref = "garminConnectIq" }
androidx-health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
